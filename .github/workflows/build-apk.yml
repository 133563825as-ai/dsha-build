name: build-apk

# 端到端出包：从官方发布的 APK 里取离线 rootfs，用本仓库的源码构建标准版 APK。
#
# 为什么这样做：offline-rootfs.bin / ubuntu-tools.bin 是构建产物、被 .gitignore 排除，
# 而 GitHub Actions runner 访问 GitHub 是内网级速度，所以让 CI 自己拉官方包再提取，
# 比把 200MB 资产塞进仓库或本地慢速下载都合理。
#
# 产物是 **debug 签名**，只用于安装验证；不带发布密钥，不得当作正式交付。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Pin the Linux-only verification entries
        run: python3 ci/patch-verification-metadata.py gradle/verification-metadata.xml

      - name: bxroot native closure is byte-exact
        run: |
          python3 -B tools/bxroot/build.py --check
          python3 -B tools/prepare-bxroot-native-proof.py --check

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Android SDK 37 + build-tools 36
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$SDK/cmdline-tools/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Fetch official offline assets
        # 官方 273MB APK 里的两个 bin 是 STORED，取出即用；不重新下载任何 apt 包。
        run: |
          curl -L --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/official.apk" \
            "https://github.com/DSH-APP/DSHA/releases/download/v0.2.0-rc2/dsha-0.2.0-rc2.apk"
          python3 ci/extract-offline-assets.py --apk "$RUNNER_TEMP/official.apk" --assets app/src/main/assets

      - name: Build locked dsh runtime (0.2.1-rc.2)
        # 0.2.1 上游内部仍有对 0.2.0 的 peer 声明，而本项目是全显式 pin 的打包方式，
        # lock 也是用 --legacy-peer-deps 生成的，这里保持同一口径。
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: python3 -B tools/prepare-dsh-runtime.py

      - name: Assemble standard debug APK
        run: |
          export LANG=C.UTF-8 LC_ALL=C.UTF-8
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleStandardDebug

      - name: Report APK identity
        run: |
          apk=$(find app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$apk"
          sha256sum "$apk" | tee "$RUNNER_TEMP/apk.sha256"
          ls -lh "$apk"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsha-standard-debug-apk
          path: |
            app/build/outputs/apk/**/*.apk
            ${{ runner.temp }}/apk.sha256
          if-no-files-found: error
          retention-days: 14
