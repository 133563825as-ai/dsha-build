name: build-verify

# 用途：在 GitHub 上验证「源码能编译、单测能过、原生库锁定成立」。
# 不产出正式签名包（签名密钥不在仓库里），也不跑设备验收。
on:
  workflow_dispatch:
  push:
    branches: ["build/**", "feat/**", "fix/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Pin the Linux-only aapt2 verification entry
        # 仓库里的 verification-metadata.xml 在 Windows 生成，只 pin 了 aapt2-windows.jar；
        # Linux 上 AGP 解析 aapt2-9.1.1-14792394-linux.jar 会因缺校验条目直接失败。
        # 只补这一条（Google Maven 的 sha256），其余仍保持严格校验。
        run: python3 ci/patch-verification-metadata.py gradle/verification-metadata.xml

      - name: bxroot native closure is byte-exact
        run: |
          python3 -B tools/bxroot/build.py --check
          python3 -B tools/prepare-bxroot-native-proof.py --check

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Android SDK 37 + build-tools 36
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$SDK/cmdline-tools/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Compile + unit tests (standard debug)
        # 离线归档（offline-rootfs.bin / dsh-runtime.bin / ubuntu-tools.bin）不入仓，
        # 因此单测必须排除资产准备任务，与 ci-fast.yml 保持同一口径。
        run: |
          export LANG=C.UTF-8 LC_ALL=C.UTF-8
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 \
            :app:testStandardDebugUnitTest \
            -x :app:prepareStandardAssets -x :app:prepareRecoveryAssets

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
